# Not every flagged object is a drone. The camera must notice, and the mission ends without touching it.
name: decoy_bottle
title: "A false alarm: the scout flags a plastic bottle"
mission: "Something crashed in field B. Find it, check it, and recover it if it is a drone."
targets:
  - {id: t1, kind: decoy, source: fixed, x: 3.0, y: 2.0}
plan:
  - {robot: drone, action: drone_mark, target: "3.0,2.0", why: "Scout marks the spot it flagged"}
  - {robot: rover, action: rover_goto, target: "$finding.f1", why: "Rover drives to the marked spot (stops 0.6 m short)"}
  - {robot: drone, action: drone_home, why: "Scout flies back to its launch pad and lands, out of the rover's way"}
  - {robot: rover, action: rover_search, target: "object on the floor", why: "Rover turns until its camera sees it"}
  - {robot: rover, action: rover_inspect, question: "What is in front of the robot? Is it a drone, and is it ours or hostile?", why: "Camera triages the object"}
  - {robot: manager, action: request_authorization, finding_id: f1, why: "A human must approve before the rover touches anything hazardous"}
  - {robot: rover, action: rover_arm, mode: pick, why: "Lower the arm"}
  - {robot: rover, action: rover_grip, mode: open, why: "Open the gripper"}
  - {robot: rover, action: rover_approach, target: "object on the floor", why: "Creep forward on the camera"}
  - {robot: rover, action: rover_grip, mode: close, why: "Close the gripper"}
  - {robot: rover, action: rover_arm, mode: carry, why: "Lift it"}
  - {robot: rover, action: rover_check_grip, why: "Camera checks that it is held"}
  - {robot: rover, action: rover_goto, target: "$zone.disposal", why: "Carry it to the disposal zone"}
  - {robot: manager, action: report, text: "Object removed.", why: "Tell the operator"}
